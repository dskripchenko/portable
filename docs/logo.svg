<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 84" width="288" height="84" role="img" aria-label="portable">
  <title>portable</title>
  <!--
    The mark from mark.svg, and the name beside it.

    The letters are drawn as blocks rather than set in a typeface. Nothing
    here may depend on a font being present: an SVG that names one renders
    with whatever the reader happens to have, and a wordmark whose spacing
    changes from machine to machine is not a wordmark. Blocks also put the
    name in the same world as the figure, which is a terminal.

    Generated once from the glyph table kept with this file's history; each
    run of adjacent cells is one rectangle, which halves the file for the
    same picture.
  -->
  <g fill="none" stroke="#3d9970" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="3" y="6" width="70" height="72" />
    <!-- the ears, folded down over the corners -->
    <path d="M3 6 L13 19" />
    <path d="M73 6 L63 19" />
  </g>
  <g fill="#3d9970">
    <circle cx="28" cy="37" r="5" />
    <circle cx="48" cy="37" r="5" />
  </g>
  <!-- the prompt: a chevron in column four, the cursor beside it in column five -->
