name: release

# A tagged version, built into self-contained bundles and published.
#
# The bundle carries its own interpreter, because the whole premise is that this
# installs on a machine with nothing on it. Requiring Python first would be the
# same problem the tool exists to solve, one level down.
#
# Windows only, and that is the whole list. Every catalog resolves Windows
# archives, so a bundle for anything else runs the tool and then hands somebody a
# `php-cgi.exe` their machine cannot execute.
#
# A macOS bundle was built here for a while, justified as a check that the
# bundler still worked. It was not much of one: everything in `bundle.py` except
# the shell launcher is exercised by this job too, and that launcher exists only
# for the bundle nobody should use — so it was code tested to keep its own test
# passing. `scripts/bundle.py --target aarch64-apple-darwin` still works for
# anyone developing on a Mac who wants one.
#
# Every action is named by commit rather than by tag, here and in the other two
# workflows. A tag is a name its owner can move, and this job holds a token that
# writes releases — so `@v4` means "whatever that repository points it at on the
# morning of a release", which is not something a checksum downstream can make
# up for. The comment beside each one says which version the commit is; the
# Dependabot config keeps them moving.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest

    # `id-token` mints the short-lived identity the attestation is signed with,
    # `attestations` files the result against this repository. Both are needed
    # only by the attest step and are granted here rather than at the top of the
    # file, so the other two jobs cannot sign anything.
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      # The tests run against the source on every push; running them again here
      # is about the tag, which may sit on a commit the branch CI never saw.
      - name: Test
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      # Authenticated, or the interpreter index is fetched anonymously and
      # counted against sixty requests an hour for the runner's address — which
      # is shared with everybody else using Actions. It failed exactly that way.
      - name: Build the bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/bundle.py --target ${{ env.TARGET }} --keep-tree

      # Built on one machine and run on another, so the run has to happen with
      # nothing of the build machine's Python around it. A bundle that quietly
      # imports the builder's interpreter works exactly once.
      - name: Run it with no Python in the environment
        shell: python
        run: |
          import glob, sys
          sys.path.insert(0, "scripts")
          from bundle import verify
          from pathlib import Path

          tree = glob.glob("dist/portable-*-${{ env.TARGET }}")
          verify(Path(tree[0]), "${{ env.TARGET }}")
          print(f"the bundle in {tree[0]} runs")

          # And that the dashboard's libraries came with it. They are vendored
          # by hand rather than installed, so nothing else would notice their
          # absence until somebody pressed the key.
          import subprocess

          result = subprocess.run(
              [str(Path(tree[0]) / "python" / "python.exe"), "-c",
               "from portable import dash; dash.build(); print('the dashboard builds')"],
              capture_output=True, text=True, check=False,
          )
          print(result.stdout, result.stderr)

          if "the dashboard builds" not in result.stdout:
              raise SystemExit("the vendored dashboard does not build inside the bundle")

      # Signed here, where the bytes are made, rather than in the job that
      # uploads them: what the attestation is worth is the claim "this archive
      # came out of this workflow, at this commit, on a GitHub runner", and that
      # claim is only true of the machine that built it.
      #
      # The published `portable-windows-x64.zip` is a byte-for-byte copy made
      # downstream and is covered by the same attestation: verification is by
      # digest, and a copy has the digest of what it copied.
      #
      # Only for a tag. A `workflow_dispatch` build is somebody trying the
      # workflow out, and provenance for an archive that is never published
      # would be a signature on nothing.
      - name: Attest what was built
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ env.TARGET }}
          path: |
            dist/*.zip
            dist/*.sha256

  publish:
    needs: bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            python3 - <<'PY' > notes.md
          import os, re, pathlib

          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          lines = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8').split('\n')
          heads = [(i, line) for i, line in enumerate(lines) if line.startswith('## ')]

          for index, (start, line) in enumerate(heads):
              if re.match(r'^## \[?' + re.escape(version) + r'\]?( |$)', line):
                  end = heads[index + 1][0] if index + 1 < len(heads) else len(lines)
                  print('\n'.join(lines[start + 1:end]).strip())
                  break
          else:
              raise SystemExit(f'CHANGELOG.md says nothing about {version}')
          PY
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

          # A copy under a name that never changes, so the download URL is one
          # somebody can type from memory and a document can print without
          # going stale:
          #
          #   .../releases/latest/download/portable-windows-x64.zip
          #
          # That is what makes a script-free install possible — two commands
          # with `curl.exe` and `tar.exe`, both of which a stock Windows has —
          # for machines where PowerShell is the thing that is locked down.
          version="${GITHUB_REF_NAME#v}"
          bundle="artifacts/portable-$version-x86_64-pc-windows-msvc.zip"

          cp "$bundle" artifacts/portable-windows-x64.zip
          printf '%s  portable-windows-x64.zip\n' \
            "$(cut -d' ' -f1 < "$bundle.sha256")" > artifacts/portable-windows-x64.zip.sha256

          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber

  # The release is only real once somebody can install it. Checked here rather
  # than by a `release: published` trigger on the installer workflow, because
  # GitHub does not start workflows from events raised by `GITHUB_TOKEN` — such
  # a trigger never fires, while looking exactly like a release being verified.
  installable:
    needs: publish
    if: github.event_name == 'push'
    name: the one-liner installs it
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - shell: powershell
        env:
          PORTABLE_INSTALL_DIR: D:\released\portable
          PORTABLE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:PORTABLE_VERSION = "${{ github.ref_name }}".TrimStart('v')

          # Under Restricted, the way a person on a managed machine has it.
          Set-ExecutionPolicy -Scope Process Restricted -Force
          Get-Content install.ps1 -Raw | Invoke-Expression

          $reported = & D:\released\portable\portable.cmd version --json | ConvertFrom-Json

          if ($reported.version -ne $env:PORTABLE_VERSION) {
            throw "installed $($reported.version), expected $env:PORTABLE_VERSION"
          }

          Write-Output "the published $($reported.version) installs and runs"
