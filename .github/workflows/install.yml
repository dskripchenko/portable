name: install

# The one-liner, run the way a person runs it, against the real published
# release. A script that is only ever read is a script that works until somebody
# tries it.
#
# There is deliberately no `release: published` trigger. GitHub does not start
# workflows from events raised by `GITHUB_TOKEN`, which is what publishes our
# releases — so such a trigger would never fire while looking exactly like a
# release is being checked. The release workflow verifies its own release
# instead, which is the moment it matters.
on:
  push:
    paths: ['install.ps1', '.github/workflows/install.yml']
  schedule:
    # Weekly. It depends on GitHub's API, on a published release and on what a
    # stock Windows carries, and none of those change when this repository does.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Version to install, or empty for the newest.
        required: false

jobs:
  one-liner:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Restricted is the default on a machine nobody has changed, and the
      # setting most often enforced on a managed one. It blocks a .ps1 on disk
      # and permits a string through `iex`, which is the whole reason the
      # instruction is written the way it is — so the test has to run under it.
      # Constrained Language Mode is what AppLocker and WDAC actually impose,
      # and it is stricter than the execution policy in a way that matters:
      # `Get-FileHash` cannot run in it at all, so a checksum has to come from
      # `certutil` instead. Measured, not assumed.
      - name: Install under Constrained Language Mode
        shell: powershell
        env:
          PORTABLE_INSTALL_DIR: D:\constrained\portable
          PORTABLE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTABLE_VERSION: ${{ inputs.version }}
        run: |
          Set-ExecutionPolicy -Scope Process Restricted -Force
          $ExecutionContext.SessionState.LanguageMode = 'ConstrainedLanguage'
          Get-Content install.ps1 -Raw | Invoke-Expression

          $reported = & D:\constrained\portable\portable.cmd version --json | ConvertFrom-Json
          Write-Output "installed $($reported.version) with PowerShell locked down"

          if (-not $reported.version) { throw "it does not report a version" }

      - name: Install under a Restricted execution policy
        shell: powershell
        env:
          PORTABLE_INSTALL_DIR: D:\test-install\portable
          PORTABLE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTABLE_VERSION: ${{ inputs.version }}
        run: |
          Set-ExecutionPolicy -Scope Process Restricted -Force
          Get-Content install.ps1 -Raw | Invoke-Expression

      - name: It is there and it runs
        shell: powershell
        run: |
          $reported = & D:\test-install\portable\portable.cmd version --json | ConvertFrom-Json
          Write-Output "installed $($reported.version)"

          if (-not $reported.version) { throw "it does not report a version" }

      # The one thing the tool writes outside its own directory, so it is worth
      # watching that it writes the right thing and can take it back.
      - name: It can put itself on the user PATH, and remove itself again
        shell: powershell
        run: |
          $before = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path

          & D:\test-install\portable\portable.cmd path add
          $after = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path

          if ($after -notlike '*test-install*') { throw "it did not go on the PATH" }

          & D:\test-install\portable\portable.cmd path remove
          $restored = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path

          if ($restored -ne $before) {
            throw "the PATH was not restored`nbefore: $before`nafter:  $restored"
          }

          Write-Output "added and removed, and the PATH is exactly as it was"

      - name: Installing again refuses rather than overwriting
        shell: powershell
        env:
          PORTABLE_INSTALL_DIR: D:\test-install\portable
          PORTABLE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-ExecutionPolicy -Scope Process Restricted -Force
          $refused = $false

          try {
            Get-Content install.ps1 -Raw | Invoke-Expression
          } catch {
            $refused = $true
            Write-Output "refused: $_"
          }

          if (-not $refused) { throw "a second install was allowed to proceed" }

      # The failure has to leave the shell alive, or the person never reads it.
      # `exit` inside `iex` ends the session, taking the explanation with it.
      - name: A refusal does not close the window
        shell: powershell
        env:
          PORTABLE_INSTALL_DIR: D:\test-install\portable
          PORTABLE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { }

          Write-Output "still here, which is the point"

  # For machines where PowerShell itself is the thing that is blocked. No script
  # is executed at all: `curl.exe`, `tar.exe` and `certutil.exe` have all been in
  # System32 since Windows 10 1803, and none of them is subject to an execution
  # policy, a language mode or a script rule.
  without-any-script:
    runs-on: windows-latest

    steps:
      - shell: cmd
        run: |
          rem -f, or curl saves the 404 page as the archive and reports success.
          rem tar then says "Unrecognized archive format", which sends the reader
          rem looking at their unpacking rather than at the URL.
          curl -fsSL -o portable.zip https://github.com/dskripchenko/portable/releases/latest/download/portable-windows-x64.zip
          if errorlevel 1 (echo the stable download URL does not work & exit /b 1)

          curl -fsSL -o portable.zip.sha256 https://github.com/dskripchenko/portable/releases/latest/download/portable-windows-x64.zip.sha256
          if errorlevel 1 (echo the stable checksum URL does not work & exit /b 1)

          certutil -hashfile portable.zip SHA256
          type portable.zip.sha256

          tar -xf portable.zip
          if errorlevel 1 (echo tar could not unpack it & exit /b 1)

          for /d %%d in (portable-*) do %%d\portable.cmd version
