name: probe
on: workflow_dispatch
jobs:
  locked-down:
    runs-on: windows-latest
    steps:
      - shell: powershell
        run: |
          $ExecutionContext.SessionState.LanguageMode = 'ConstrainedLanguage'
          Write-Output "MODE=$($ExecutionContext.SessionState.LanguageMode)"
          function Try-It($label, $block) {
            try { $null = & $block; Write-Output "OK   $label" }
            catch { Write-Output "FAIL $label : $($_.Exception.Message.Split([char]10)[0])" }
          }
          Try-It 'Net.ServicePointManager' { [Net.ServicePointManager]::SecurityProtocol }
          Try-It 'IO.Path::GetTempPath'    { [IO.Path]::GetTempPath() }
          Try-It 'Guid::NewGuid'           { [Guid]::NewGuid() }
          Try-It 'Math::Round'             { [Math]::Round(1.5) }
          Try-It 'Environment::OSVersion'  { [Environment]::OSVersion.Platform }
          Try-It 'string method ToLower'   { 'ABC'.ToLower() }
          Try-It 'New-Guid cmdlet'         { New-Guid }
          Try-It 'Invoke-WebRequest'       { Invoke-WebRequest -Uri 'https://example.com' -UseBasicParsing -TimeoutSec 20 }
          Try-It 'Invoke-Expression'       { Invoke-Expression 'Write-Output hi' }
          Try-It 'Get-FileHash'            { Get-FileHash $env:ComSpec }
          Try-It 'Expand-Archive present'  { Get-Command Expand-Archive }
  no-script-at-all:
    runs-on: windows-latest
    steps:
      - shell: cmd
        run: |
          echo === curl + tar, no script executed ===
          curl -sSL -o p.zip https://github.com/dskripchenko/portable/releases/download/v0.1.2/portable-0.1.2-x86_64-pc-windows-msvc.zip
          if errorlevel 1 (echo CURL_FAILED & exit /b 1)
          tar -xf p.zip
          if errorlevel 1 (echo TAR_FAILED & exit /b 1)
          dir /b
          portable-0.1.2-x86_64-pc-windows-msvc\portable.cmd version
          certutil -hashfile p.zip SHA256 | findstr /v ":"
