name: probe
on: workflow_dispatch
jobs:
  what-is-there:
    runs-on: windows-latest
    steps:
      - shell: powershell
        run: |
          Write-Output "PSVersion=$($PSVersionTable.PSVersion)"
          foreach ($n in 'curl.exe','tar.exe','certutil.exe','winget.exe','bitsadmin.exe') {
            $p = (Get-Command $n -ErrorAction SilentlyContinue).Source
            Write-Output ("HAVE {0} = {1}" -f $n, $(if ($p) { $p } else { 'MISSING' }))
          }
          Write-Output "HAVE Expand-Archive = $([bool](Get-Command Expand-Archive -ErrorAction SilentlyContinue))"
          Write-Output "HAVE Get-FileHash = $([bool](Get-Command Get-FileHash -ErrorAction SilentlyContinue))"
          Write-Output "POLICY=$(Get-ExecutionPolicy)"
          Set-ExecutionPolicy -Scope Process Restricted -Force
          Write-Output "POLICY_NOW=$(Get-ExecutionPolicy)"
          try { iex 'Write-Output "IEX_RAN=yes"' } catch { Write-Output "IEX_FAILED=$_" }
          $t = Join-Path $env:TEMP 'p.ps1'
          Set-Content -Path $t -Value 'Write-Output "FILE_RAN=yes"'
          try { & $t } catch { Write-Output "FILE_BLOCKED=yes" }
