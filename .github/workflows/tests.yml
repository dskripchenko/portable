name: tests

# Windows is not one platform among several here — it is the target. The suite
# runs on macOS too, because that is where it is written, and a failure there
# usually means something was assumed about paths or line endings.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.13']

    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      # `textual` and `pytest-asyncio` are the dashboard's, which the bundle
      # vendors and a checkout does not carry. Without them its tests skip — and
      # so does the guard that keeps four vendored packages from becoming ten.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pytest-asyncio textual

      - name: Test
        run: python -m pytest -q
