name: tests

# Windows is not one platform among several here — it is the target. The suite
# runs on macOS too, because that is where it is written, and a failure there
# usually means something was assumed about paths or line endings. It also
# checks more than a run on that machine does: the dashboard's libraries are
# installed below, and on the developer's own Python they are not, so a local
# `pytest` skips a dozen tests and still prints green.
#
# Three jobs rather than four. Windows carries both ends of the supported range
# — 3.13 is what the bundle ships, 3.11 is what `requires-python` promises —
# and macOS carries only 3.13. The fourth cell, the floor on a platform that is
# not a target, was testing a combination nobody runs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ['3.11', '3.13']
        exclude:
          - os: macos-latest
            python: '3.11'

    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # `textual` and `pytest-asyncio` are the dashboard's, which the bundle
      # vendors and a checkout does not carry. Without them its tests skip — and
      # so does the guard that keeps four vendored packages from becoming ten.
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pytest-asyncio textual

      - name: Test
        run: python -m pytest -q
