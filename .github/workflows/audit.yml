name: audit

# What the bundle carries, checked against the advisory database.
#
# `pyproject.toml` declares no dependencies and that is true of the tool: it
# imports nothing outside the standard library. It is not true of the archive
# people download. The dashboard's four libraries are vendored — fetched as
# wheels, verified against the digest PyPI publishes, and unpacked into the
# bundle's `site-packages` — so they are pinned in `scripts/bundle.py` rather
# than in any file a scanner reads. Pointing `pip-audit` at the project would
# audit an empty list and report a clean bill of health for a forty-six
# megabyte archive full of somebody else's code.
#
# So the list is taken from where the pins actually live.
#
# Weekly as well as on a change, and the schedule is the more useful of the
# two. An advisory is published against a version that has been shipped for
# months; nothing in this repository moves on the day that happens.
on:
  push:
    paths: ['scripts/bundle.py', 'pyproject.toml', '.github/workflows/audit.yml']
  pull_request:
    paths: ['scripts/bundle.py', 'pyproject.toml']
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendored:
    name: what the bundle carries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Read out of the bundler rather than copied into a second file that
      # would then have to be kept in step with it. A list of pins that can
      # disagree with the pins is worse than no list.
      - name: The pinned set
        run: |
          python - <<'PY' > vendored.txt
          import sys
          sys.path.insert(0, "scripts")
          from bundle import VENDORED

          for name, version in VENDORED.items():
              print(f"{name}=={version}")
          PY

          cat vendored.txt

      # `--no-deps`, because this is the set that ships and not one to resolve
      # from. The bundler takes these four wheels and nothing they name — that
      # is measured and enforced there — so auditing their dependency trees
      # would report on code the archive does not contain.
      - name: Audit
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --requirement vendored.txt --no-deps --strict
